name: Build check
# Compila y verifica ramas de trabajo sin desplegar; el deploy a producción sigue siendo deploy-hostinger.yml en main.
on:
  push:
    branches: ['cc-web/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.23.4'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Editorial tests
        run: node --test scripts/test-editorial.mjs
      - name: Build and verify export
        run: npm run build
      - name: Summarize export
        run: |
          for f in index.html en.html blog.html en/blog.html 404.html; do printf '%s: ' "$f"; grep -o '<html lang="[a-z]*"' "out/$f"; done
          ls out/en out/en/blog 2>/dev/null | head -20
